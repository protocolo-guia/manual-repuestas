<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual de respuestas · Newell Brands Colombia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2433;--muted:#5d6678;--line:#e6e8ee;--bg:#f6f7fb;--card:#fff;--brand:#1B2A4A;--accent:#E8A33D;--soft:#FDF3E3;--radius:14px}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.logo span{background:linear-gradient(135deg,#1B2A4A,#0E7FB8);color:#fff;border-radius:10px;padding:4px 8px;font-size:14px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--line);border-radius:999px;font:inherit;font-size:15px;background:var(--bg)}
.search input:focus{outline:none;border-color:#0E7FB8;background:#fff}
.search:before{content:"🔍";position:absolute;left:13px;top:9px;font-size:15px}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--muted);transition:.15s}
nav.tabs a:hover{border-color:#b9bfcc;color:var(--ink)}
nav.tabs a.on{color:#fff;border-color:transparent}
.persona{background:#fff;border-bottom:1px solid var(--line)}
.persona-in{max-width:1180px;margin:0 auto;padding:8px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.persona input{padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:13px;width:170px}
.persona b{color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
.hero{border-radius:20px;padding:28px;color:#fff;background:linear-gradient(135deg,#1B2A4A 0%,#0E7FB8 100%);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.2}
.hero p{margin:0;opacity:.9;max-width:680px}
.hero .stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.hero .stats div{font-size:13px;opacity:.9}.hero .stats b{display:block;font-size:22px}
h2{font-size:20px;margin:30px 0 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.bcard{border-radius:var(--radius);padding:18px;background:#fff;border:1.5px solid var(--line);text-decoration:none;display:block;transition:.15s;position:relative;overflow:hidden}
.bcard:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,30,60,.08)}
.bcard .bar{position:absolute;inset:0 0 auto 0;height:6px}
.bcard h3{margin:6px 0 4px;font-size:18px}
.bcard p{margin:0;color:var(--muted);font-size:14px}
.bcard .go{margin-top:12px;font-weight:800;font-size:13px}
.rules{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rule{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px}
.rule .i{font-size:22px}
.rule b{display:block}.rule span{color:var(--muted);font-size:14px}
.triage{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:18px}
.triage .q{font-weight:800;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--ink);transition:.15s}
.chip:hover{border-color:#0E7FB8;background:#EAF6FC}
.chip.on{background:#1d2433;color:#fff;border-color:#1d2433}
.ans{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--bg);display:none}
.ans.show{display:block}
/* Brand view */
.bhero{border-radius:20px;padding:24px 26px;color:#fff;background:var(--brand);display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:flex-start}
.bhero h1{margin:0;font-size:26px}
.bhero .tone{margin:6px 0 0;max-width:560px;opacity:.92}
.bhero .firma{display:flex;flex-direction:column;gap:6px;font-size:13px}
.bhero .firma span{background:rgba(255,255,255,.14);padding:5px 10px;border-radius:8px}
.note{margin-top:12px;background:var(--soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:8px;font-size:14px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px;align-items:start}
.tlist{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:8px}
.titem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;font-size:14px;font-weight:700;color:var(--ink);text-decoration:none}
.titem:hover{background:var(--bg)}
.titem.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.titem .ic{font-size:18px;width:24px;text-align:center}
.titem .n{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 7px;font-weight:700}
.detail{background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:24px;min-height:300px}
.dhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dhead .big{font-size:34px}
.dhead h2{margin:0;font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}
.tag.escalar{background:#FDECEC;color:#9B2C2C}.tag.crisis{background:#9B2C2C;color:#fff}
.tag.dm{background:#E8F1FD;color:#1C4E91}.tag.datos{background:#FFF3DA;color:#8A5A00}
.tag.ocultar{background:#EFEFF2;color:#444}.tag.react{background:#FCE9EF;color:#9C2F55}
.tag.repost{background:#E7F7EE;color:#1D6B3E}.tag.link{background:#EDEBFC;color:#4A3BA8}
.sec{margin-top:22px}
.sec h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.when{font-size:15px}
.ej{display:flex;flex-wrap:wrap;gap:8px}
.ej span{background:var(--bg);border-radius:12px 12px 12px 3px;padding:7px 12px;font-size:14px;font-style:italic;color:#3a4252}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:6px 0 6px 36px;font-size:15px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.pub{display:grid;gap:8px}
.pubi{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}
.pubi .t{flex:1;font-size:15px}
.copy{flex:none;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:12px;padding:7px 12px;border-radius:8px;transition:.15s}
.copy:hover{filter:brightness(1.15)}
.copy.ok{background:#1D6B3E}
.dmtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dmtabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.dmtabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bubble{background:var(--soft);border-radius:16px 16px 16px 4px;padding:16px 18px;white-space:pre-wrap;font-size:15px;position:relative;word-break:break-word}
.bubble .copy{position:absolute;top:10px;right:10px}
.bubble .txt{padding-right:70px}
.ph{background:#FFE58F;border-radius:4px;padding:0 3px;font-weight:700}
.fill{background:#D5F5E3;border-radius:4px;padding:0 3px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.links a:hover{border-color:var(--brand)}
.reg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.reg div{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.reg small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.warn{background:#FFF8E6;border:1.5px solid #F3D98B;border-radius:12px;padding:12px 14px;font-size:14px}
.empty{color:var(--muted);font-style:italic;font-size:14px}
.tcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:20px}
.tcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;transition:.15s}
.tcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.tcard .ic{font-size:24px}.tcard b{display:block;margin-top:4px;font-size:15px}.tcard small{color:var(--muted)}
.crisis{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ccard{background:#fff;border:1.5px solid var(--line);border-top:5px solid #9B2C2C;border-radius:var(--radius);padding:18px}
.ccard h3{margin:0 0 4px}.ccard p{margin:0 0 10px;color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--line)}
td,th{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.res{display:grid;gap:10px}
.resi{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;display:flex;gap:12px;align-items:center}
.resi:hover{border-color:#0E7FB8}
.resi .bd{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:2px 7px}
.resi small{display:block;color:var(--muted)}
.foot{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
.mobile-pick{display:none}
@media(max-width:820px){
 .layout{grid-template-columns:1fr}.tlist{display:none}
 .mobile-pick{display:block;margin-bottom:12px}
 .mobile-pick select{width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-weight:700}
 .hero h1{font-size:22px}.detail{padding:18px}
 .persona input{width:130px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="#inicio"><span>CX</span> Manual de respuestas</a>
    <div class="search"><input id="q" type="search" placeholder="Busca un tema o palabra: garantía, precio, repuesto, concurso…" autocomplete="off"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="persona"><div class="persona-in">
  ✏️ <b>Personaliza las respuestas:</b>

  <label>Tu nombre <input id="pa" placeholder="ej. Carolina"></label>
  <span>Lo que dejes vacío queda <span class="ph">resaltado</span> para completar.</span>
</div></div>
<main id="app"></main>

let state={pn:'',pa:''};
try{state.pn=localStorage.getItem('mr_pn')||'';state.pa=localStorage.getItem('mr_pa')||''}catch(e){}
$('#pn').value=state.pn;$('#pa').value=state.pa;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fillText(t){return t.replace(/\{nombre\}/g,state.pn||'{nombre}').replace(/\{tu nombre\}/g,state.pa||'{tu nombre}').replace(/\{usuario\}/g,state.pn?state.pn.replace(/\s+/g,'').toLowerCase():'{usuario}')}

  let h=esc(t);

     .replace(/\{tu nombre\}/g,state.pa?`<span class="fill">${esc(state.pa)}</span>`:'<span class="ph">{tu nombre}</span>')
     .replace(/\{usuario\}/g,state.pn?`<span class="fill">${esc(state.pn.replace(/\s+/g,'').toLowerCase())}</span>`:'<span class="ph">{usuario}</span>')
     .replace(/\[([^\]]+)\]/g,'<span class="ph">[$1]</span>')
     .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');

}
function copyBtn(text){return `<button class="copy" data-copy="${encodeURIComponent(text)}">Copiar</button>`}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-copy]');if(!b)return;
  const raw=fillText(decodeURIComponent(b.dataset.copy));
  let ok=false;
  try{await navigator.clipboard.writeText(raw);ok=true}catch(err){
    const ta=document.createElement('textarea');ta.value=raw;document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch(e2){}ta.remove();
  }
  b.textContent=ok?'¡Copiado! ✓':'Selecciona y copia';b.classList.toggle('ok',ok);

});

function searchView(q){
  setBrandVars(null);renderTabs('');
  const n=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const terms=n(q).split(/\s+/).filter(Boolean);
  const hits=[];
  ORDER.forEach(k=>BRANDS[k].topics.forEach(t=>{
    const hay=n([t.name,t.cuando,t.ejemplos.join(' '),t.pasos.join(' '),t.publico.join(' '),t.dm.map(d=>d.t+' '+d.r).join(' ')].join(' '));
    let score=0;terms.forEach(w=>{if(n(t.name).includes(w))score+=5;if(hay.includes(w))score+=1});
    if(terms.every(w=>hay.includes(w)))hits.push({k,t,score});
  }));
  hits.sort((a,b)=>b.score-a.score);
  app.innerHTML=`<h2>Resultados para “${esc(q)}” <span style="color:var(--muted);font-weight:600">(${hits.length})</span></h2>
  ${hits.length?`<div class="res">${hits.map(({k,t})=>`<a class="resi" href="#${k}-${t.id}"><span style="font-size:22px">${t.icon}</span><div><span class="bd" style="background:${BRANDS[k].color}">${BRANDS[k].name}</span> <b>${t.name}</b><small>${t.cuando}</small></div></a>`).join('')}</div>`:'<p class="empty">No encontramos ese tema. Prueba con otra palabra (ej. «garantía», «precio», «concurso», «spam»).</p>'}`;
}
function route(){
  const h=(location.hash||'#inicio').slice(1);
  const qv=$('#q').value.trim();
  if(qv&&h==='buscar'){searchView(qv);return}
  if(h==='crisis')return crisisView();
  if(h==='registro')return registroView();
  if(h==='enlaces')return enlacesView();
  const [k,...rest]=h.split('-');
  if(BRANDS[k])return brandView(k,rest.join('-')||null);
  home();
}
let tmr;
$('#q').addEventListener('input',e=>{clearTimeout(tmr);tmr=setTimeout(()=>{const v=e.target.value.trim();if(v){if(location.hash!=='#buscar')location.hash='buscar';else route()}else{location.hash='inicio'}},200)});
['pn','pa'].forEach(id=>$('#'+id).addEventListener('input',e=>{state[id]=e.target.value.trim();try{localStorage.setItem('mr_'+id,state[id])}catch(x){}
  const h=location.hash.slice(1);if(h==='crisis'||h==='enlaces'||BRANDS[h.split('-')[0]])route();}));
window.addEventListener('hashchange',route);
route();
